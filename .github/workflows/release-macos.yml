name: macOS universal release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Validate release tag and version
        shell: bash
        run: |
          version="$(sed -E 's/-build\.[0-9]+$//' VERSION.txt)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match VERSION.txt (v$version)" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build universal binaries and run C++ tests
        run: scripts/build-mac.sh

      - name: Test automatic manager setup
        run: |
          result="$(mktemp)"
          trap 'rm -f "$result"' EXIT
          ManagerApp/AES67Manager.app/Contents/MacOS/AES67Manager --self-test "$result"

      - name: Test quarantine-safe package staging
        run: python3 scripts/test-package-quarantine.py

      - name: Package installer, source archive, and checksums
        run: scripts/package-mac.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "artifacts/AES67-Mac-$RELEASE_VERSION-universal.pkg" \
              "artifacts/AES67-Mac-$RELEASE_VERSION-source.tar.gz" \
              artifacts/SHA256SUMS.txt artifacts/GETTING-STARTED.md \
              artifacts/TESTING.md artifacts/TROUBLESHOOTING.md \
              artifacts/Deinstallieren.command --clobber
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            "artifacts/AES67-Mac-$RELEASE_VERSION-universal.pkg" \
            "artifacts/AES67-Mac-$RELEASE_VERSION-source.tar.gz" \
            artifacts/SHA256SUMS.txt \
            artifacts/GETTING-STARTED.md \
            artifacts/TESTING.md \
            artifacts/TROUBLESHOOTING.md \
            artifacts/Deinstallieren.command \
            --prerelease --verify-tag --generate-notes \
            --title "AES67 Mac $RELEASE_VERSION — experimenteller Testbuild"
